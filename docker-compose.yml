services:
  db:
    image: postgres:16-alpine
    container_name: qcocheck-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: qcocheck
    ports:
      - "5432:5432"
    volumes:
      - qcocheck-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d qcocheck"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  qcocheck-db-data:
